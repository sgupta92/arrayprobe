<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- source: docs/10-known-gaps.md, HVPS table row "Not a fixed probe or year property" (ratios 1.2402, 1.0855, 0.9987; 1.2402 is the 2016 ratio on the archive's own grid, which superseded 1.4625) -->
  <title id="t">HVPS particle counts, ours over archived, per flight</title>
  <desc id="d">Ratio of HVPS particles counted by the port to those in the archived product, for three flights: 1.2402 on the 2016 flight, 1.0855 on 2017-08-13 and 0.9987 on 2017-08-26, against exact agreement at 1.0. The ratios bracket 1.0 from both sides, so the disagreement is a per-flight effect, not a probe or year property.</desc>
  <rect id="figure-background" x="0" y="0" width="960" height="220" fill="#ffffff"/>
  <!-- y = 180 - (ratio - 0.9) / 0.6 * 150 -->
  <g stroke="#5B6B7C" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="90" y1="130" x2="900" y2="130"/>
    <line x1="90" y1="80" x2="900" y2="80"/>
    <line x1="90" y1="30" x2="900" y2="30"/>
  </g>
  <line x1="90" y1="180" x2="900" y2="180" stroke="#5B6B7C" stroke-width="1"/>
  <line x1="90" y1="155" x2="900" y2="155" stroke="#5B6B7C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="896" y="149" text-anchor="end" font-size="12" fill="#5B6B7C">1.0 = exact agreement</text>
  <g font-size="12" fill="#5B6B7C" text-anchor="end">
    <text x="80" y="184">0.9</text>
    <text x="80" y="134">1.1</text>
    <text x="80" y="84">1.3</text>
    <text x="80" y="34">1.5</text>
  </g>
  <text x="20" y="110" font-size="12" fill="#5B6B7C" transform="rotate(-90 20 110)" text-anchor="middle">ours / archived</text>

  <g fill="#4A6FA5" stroke="#FFFFFF" stroke-width="2">
    <circle cx="240" cy="94.95" r="6"/>
    <circle cx="480" cy="133.6" r="6"/>
    <circle cx="720" cy="155.3" r="6"/>
  </g>
  <g font-size="13" font-weight="600" fill="#4A6FA5">
    <text x="252" y="100">1.2402</text>
    <text x="492" y="126">1.0855</text>
    <text x="732" y="172">0.9987</text>
  </g>
  <g font-size="13" fill="#5B6B7C" text-anchor="middle">
    <text x="240" y="204">2016</text>
    <text x="480" y="204">2017-08-13</text>
    <text x="720" y="204">2017-08-26</text>
  </g>
</svg>
